<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Panel del local</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="wrap hidden" style="padding-top:12vh">
  <div class="card stack center">
    <h1>Panel del local</h1>
    <p class="muted" style="margin:0" id="loginHelp">Ingresá tu PIN</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN o clave" style="text-align:center;font-size:1.4rem;letter-spacing:.3em">
    <div id="pinErr" class="notice bad hidden">PIN o clave incorrectos</div>
    <button class="btn primary block" id="pinBtn">Entrar</button>
    <a href="index.html" class="small" id="clientLink">Ver página de reservas</a>
  </div>
</div>
<div id="app" class="hidden">
  <div class="topbar">
    <div class="row between wrap wide" style="padding-bottom:0"><b id="shop" style="font-family:var(--display);font-size:1.2rem"></b><a class="small" href="index.html" id="clientLink2" target="_blank" rel="noopener">Ver página de clientes ↗</a></div>
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="agenda">Agenda</button>
      <button class="tab" data-tab="caja">Caja</button>
      <button class="tab" data-tab="clientes">Clientes</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
    </nav>
  </div>
  <main class="wrap wide" id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
